[workspace]
resolver = "3"
members = [
    "crates/gardyn-core",
    "crates/gardyn-hal",
    "crates/gardyn-rules",
    "crates/gardyn-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
gardyn-core = { path = "crates/gardyn-core" }
gardyn-hal = { path = "crates/gardyn-hal" }
gardyn-rules = { path = "crates/gardyn-rules" }

jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
