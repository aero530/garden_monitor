[workspace]
resolver = "3"
members = [
    "crates/gardyn-auth",
    "crates/gardyn-core",
    "crates/gardyn-edge",
    "crates/gardyn-guard",
    "crates/gardyn-proto",
    "crates/gardyn-hal",
    "crates/gardyn-rules",
    "crates/gardyn-sim",
    "crates/gardyn-store",
    "crates/gardyn-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
gardyn-auth = { path = "crates/gardyn-auth" }
gardyn-core = { path = "crates/gardyn-core" }
gardyn-hal = { path = "crates/gardyn-hal" }
gardyn-proto = { path = "crates/gardyn-proto" }
gardyn-rules = { path = "crates/gardyn-rules" }
gardyn-sim = { path = "crates/gardyn-sim" }
gardyn-store = { path = "crates/gardyn-store" }
tokio = { version = "1", features = ["full"] }

jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1.24", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
