[workspace]
resolver = "3"
members = [
    "crates/garden-auth",
    "crates/garden-cli",
    "crates/garden-core",
    "crates/garden-edge",
    "crates/garden-guard",
    "crates/garden-proto",
    "crates/garden-hal",
    "crates/garden-notify",
    "crates/garden-rules",
    "crates/garden-sim",
    "crates/garden-store",
    "crates/garden-vision",
    "crates/garden-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
garden-auth = { path = "crates/garden-auth" }
garden-core = { path = "crates/garden-core" }
garden-hal = { path = "crates/garden-hal" }
garden-notify = { path = "crates/garden-notify" }
garden-proto = { path = "crates/garden-proto" }
garden-rules = { path = "crates/garden-rules" }
garden-sim = { path = "crates/garden-sim" }
garden-store = { path = "crates/garden-store" }
garden-vision = { path = "crates/garden-vision" }
tokio = { version = "1", features = ["full"] }

jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1.24", features = ["v4", "serde"] }
# JPEG for camera frames, PNG for the simulator and calibration overlays.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
