# ntfy server configuration for the garden.
#
# Install to /etc/garden/ntfy-server.yml
#
# Change base-url before starting. Everything else is sensible as-is.

# How your PHONE reaches this server — not how the brain reaches it.
#
# The public name Caddy holds a certificate for, and it must resolve from mobile data
# rather than only from the house: ntfy being reachable from anywhere is the whole
# reason it is exposed while the brain is not. See DESIGN.md §10.
base-url: "https://ntfy.example.com"

# Container-internal only. Caddy reaches this over the podman network; nothing
# publishes it to the host and nothing forwards it at the router.
listen-http: ":8090"

cache-file: "/var/cache/ntfy/cache.db"
# Long enough that a phone which was off overnight still catches up.
cache-duration: "72h"

# ntfy's default is to let anyone publish to and read any topic. On a LAN that
# means anyone who can reach the port can push to your phone, or watch what your
# garden is telling you. Deny by default; grant explicitly.
auth-file: "/var/lib/ntfy/auth.db"
auth-default-access: "deny-all"

# The phone app holds a connection open. Without a keepalive shorter than the
# usual NAT timeout it reconnects constantly and eats battery.
keepalive-interval: "45s"

# Nothing here sends attachments, and accepting them is a way to fill the disk.
attachment-cache-dir: ""

behind-proxy: true
