# ntfy server configuration for the garden.
#
# Install to /etc/garden/ntfy-server.yml
#
# Change base-url before starting. Everything else is sensible as-is.

# How your PHONE reaches THIS server. Not how the brain reaches it, and not where the
# Done buttons point.
#
# Worth being precise, because an older comment here claimed ntfy stamps this into the
# action buttons and it does not: those URLs are built by the brain from
# `GARDEN_BASE_URL` and travel inside the message. This value is ntfy's own idea of its
# address — its web app, attachment links, and what the phone app is pointed at.
#
# **LAN address and port, for a local-only deployment.** Notifications arrive whenever
# the phone is on your wifi, and nothing is exposed to the internet. Start here.
#
# When you put a proxy in front of it — `garden-caddy` on this VM, or one you already
# run elsewhere — change this to the public name that holds the certificate and set
# `behind-proxy: true` below. It must then resolve from mobile data rather than only
# from the house, which is the entire point of exposing ntfy while the brain stays
# private. See DESIGN.md §10.
base-url: "http://192.168.86.10:8090"

listen-http: ":8090"

cache-file: "/var/cache/ntfy/cache.db"
# Long enough that a phone which was off overnight still catches up.
cache-duration: "72h"

# ntfy's default is to let anyone publish to and read any topic. On a LAN that
# means anyone who can reach the port can push to your phone, or watch what your
# garden is telling you. Deny by default; grant explicitly.
auth-file: "/var/lib/ntfy/auth.db"
auth-default-access: "deny-all"

# The phone app holds a connection open. Without a keepalive shorter than the
# usual NAT timeout it reconnects constantly and eats battery.
keepalive-interval: "45s"

# Nothing here sends attachments, and accepting them is a way to fill the disk.
attachment-cache-dir: ""

# Off, because nothing is proxying this yet — and it is not a harmless default.
#
# `behind-proxy: true` tells ntfy to believe the `X-Forwarded-For` header when deciding
# who a request came from. Correct behind a proxy you control; wrong when clients
# connect directly, because anyone on the LAN could then claim any address and defeat
# per-IP rate limiting by inventing a new one per request.
#
# Turn it on at the same moment you put a proxy in front, not before.
behind-proxy: false
