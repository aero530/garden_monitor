[package]
name = "gardyn-vision"
description = "Camera frame to per-slot metrics: canopy area, chlorosis, seedling counts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gardyn-core.workspace = true
image.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Only the VisualDiagnosis stage needs a network client, and it talks to a local
# Ollama. Kept optional so the canopy pipeline — which is most of the value — does not
# drag an HTTP stack into the edge agent or the calibration CLI.
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
diagnosis = ["dep:reqwest", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
