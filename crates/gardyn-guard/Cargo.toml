[package]
name = "gardyn-guard"
description = "Failsafe supervisor. Takes the lights and pump to a safe schedule if the edge agent stops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gardyn-hal.workspace = true
jiff.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(all(target_os = "linux", any(target_arch = "arm", target_arch = "aarch64")))'.dependencies]
rppal = "0.19"

[lints]
workspace = true
